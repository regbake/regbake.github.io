<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to lifeonthereg</title>
  <!-- Babel -->
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <!-- <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script> -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <link rel="stylesheet" type="text/css" href="style.css">
  <script type="text/javascript" src="js/global-header.js"></script>
  <script type="text/javascript" src="js/menu-item.js"></script>
</head>
<body>
  <script type="text/javascript">
    notes = []; // intentional global scope
    currentNote = undefined;

    fetch("CAMP_exam_prep_udemy.txt")
      .then(response => response.text())
      .then(txt => {
        notes = txt.split('\n\n'); // get array of individual note strings
      }).catch(error => console.log(error));

    const handleNote = async () => {
      setRandomNote();

      // get dom element and append
      const noteEl = document.querySelector("#note");
      
      noteEl.innerHTML = currentNote;
    }

    const getRandomNote = () => {
      const numberOfNotes = notes.length;
      const randomIndex = Math.floor(Math.random() * numberOfNotes);
      const randomNote = notes[randomIndex];

      console.log('random note is: ', randomNote);
      if (randomNote !== "") {
        return randomNote;
      }
      
      // try again
      return getRandomNote();
    }

    const setRandomNote = () => currentNote = getRandomNote();
  </script>

  <global-header
    heading="g"
    subheading="red-g"
    href="/index.html"
  >
  </global-header>

  <div class="menu-contain">
    <menu-item
      name="pm note cards"
      href="/CAPM-notes.html"
    ></menu-item>

    <menu-item
      name="pm flashcards"
      href="/pm-flash-cards.html"
    ></menu-item>
    
    <menu-item
      name="in-resume"
      href="/inresume.html"
    ></menu-item>

    <menu-item
      name="about"
      href="/about.html"
    ></menu-item>

    <menu-item
      name="guitar"
      href="/guitar.html"
    ></menu-item>
  </div>

  <h1>PM Note list</h1>
  <h2 id="note"></h2>

  <button onclick="handleNote()">Next Note</button>
</body>
</html>
